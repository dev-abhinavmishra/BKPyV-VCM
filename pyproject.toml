[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtual-cell-model"
version = "0.1.0"
description = "A modular Virtual Cell Model platform for mechanistic simulation and AI/ML prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ISEF Research Project"}
]
keywords = ["computational-biology", "simulation", "cell-model", "virtual-cell"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.30.0",
]
analysis = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "umap-learn>=0.5",
    "pyarrow>=14.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "nbconvert>=7.16.0,<8",
    "nbclient>=0.10.0,<0.12",
    "ipykernel>=6.29.0,<8",
]

[project.scripts]
vcm = "vcm.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/vcm"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests that take more than a few seconds (deselect with '-m \"not slow\"')",
]
