# BKPyV ODE Baseline Configuration - Uninfected Kidney Cell
# ODE-based simulation using scipy numerical integration
experiment_id: bkpyv_ode_baseline_uninfected
plugin: transplant.bk_polyomavirus
simulator: bkpyv_ode
simulation_length: 100.0
timestep: 1.0
time_unit: days
output_path: outputs/bkpyv/ode_baseline/
save_interval: 1
seed: 42

# Environment settings (physiological conditions)
environment:
  temperature: 37.0
  ph: 7.4
  oxygen_level: 21.0
  glucose_concentration: 5.0
  nutrient_availability: {}
  stress_factors: {}

# No perturbations - baseline uninfected state
perturbations: []

# ODE solver configuration
simulator_parameters:
  # ODE solver settings
  ode_solver: LSODA  # Adaptive stiff/non-stiff solver
  rtol: 1.0e-6  # Relative tolerance
  atol: 1.0e-8  # Absolute tolerance
  max_step: 1.0  # Maximum step size
  
  # Research-validated parameters (mapped to ODE coefficients)
  # Source: AJT-16-821.pdf, single-cell studies, clinical data
  tacrolimus_enhancement_factor: 1.5  # weaker immune targeting -> higher production
  mtor_inhibition_factor: 0.5  # in-vitro IC90 ~4 ng/mL (Hirsch 2016)
  t_antigen_replication_threshold: 0.5  # T antigen requirement
  cell_cycle_s_phase_bonus: 2.0  # S-phase replication enhancement
  dna_replication_coupling: 0.8  # Host-viral replication coupling
  innate_immune_suppression_factor: 0.5  # Immune suppression of replication
  dna_damage_response_enhancement: 1.3  # DDR enhancement of replication
  translation_enhancement_factor: 2.0  # Translation pathway elevation
  mitochondrial_function_importance: 0.8  # Mitochondrial gene upregulation
  protein_degradation_inhibition: 0.3  # Proteasome pathway involvement

metadata:
  description: "ODE-based baseline uninfected kidney tubular epithelial cell using scipy numerical integration"
  research_grounding: "ODE parameters mapped from AJT-16-821.pdf and single-cell transcriptomic studies"
  notes: "Uses 15-dimensional ODE system with LSODA adaptive solver for stiff/non-stiff equations"